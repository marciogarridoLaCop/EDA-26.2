<h1 class="enunciado surge" style="animation-delay:.1s">
  <span class="de">c</span> = {{ "%.6f"|format(c) }}
</h1>
<p class="legenda-topo surge" style="animation-delay:.16s">
  Para <b>f(x) = {{ expressao }}</b>, o intervalo fechou em
  <b>{{ resultado.iteracoes }}</b> passos até <b>f(c) = d</b>. O erro máximo em c
  é a largura final do intervalo.
</p>
